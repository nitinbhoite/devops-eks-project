apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 125647512856.dkr.ecr.ap-south-1.amazonaws.com/devops-backend
          ports:
            - containerPort: 5000